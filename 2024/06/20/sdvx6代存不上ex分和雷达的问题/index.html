<h1 id="现象">现象</h1>

<p>打完一首歌 ex正常更新，退出账号时，雷达图正常增加</p>

<p>但是再刷卡进入时，ex分和雷达显示没有变化</p>

<hr />

<h1 id="问题点确认">问题点确认</h1>

<p>氧无中的plugins/sdvx@asphyxia/下的handlers，models文件夹里的几个文件没有更新exsocre</p>

<p>导致存分的时候，在sdvx@asphyxia.db里存分的字段里根本就没有exsocre</p>

<hr />

<h1 id="解决方案">解决方案</h1>

<p>所以换一套氧无，别自己尝试只换几个文件，要么不行，要么回线混杂，直接全换氧无</p>
