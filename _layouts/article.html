---
layout: base
---
<article class="article-page"><a class="back-link" href="{{ '/blog.html' | relative_url }}">← 返回博客</a><header class="article-header-custom"><p class="eyebrow">{{ page.tags | default: 'NOTE' }}</p><h1>{{ page.title }}</h1><div class="article-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y年%m月%d日' }}</time><span>·</span><span>{{ page.content | number_of_words }} words</span></div></header><div class="article-content-custom">{{ content }}</div><footer class="article-end"><a href="{{ '/blog.html' | relative_url }}">← 继续阅读其他文章</a></footer></article>
