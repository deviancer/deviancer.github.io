---
layout: default
---
<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <p class="post-meta">
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time>
            {% if page.categories %}
             | 分类: {% for category in page.categories %}{{ category }}{% endfor %}
            {% endif %}
        </p>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    {% if page.tags %}
    <footer class="post-footer">
        <p class="post-tags-bottom">TAG: {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</p>
    </footer>
    {% endif %}
</article>
